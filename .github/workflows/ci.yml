name: CI

on:
  push:
    branches:
      - '**' # branches only, so release tags do not re-trigger
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    # Pushes cover every branch here, so pull_request only has to catch forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Type-checks the server and the views, and regenerates the view registry
      # for verification in next step.
      - name: Build
        run: npm run build

      - name: Verify view registry is up to date
        run: git diff --exit-code -- .skybridge/views.d.ts
